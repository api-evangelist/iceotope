aid: iceotope
name: Iceotope
description: 'Iceotope Technologies is a Sheffield, UK precision liquid cooling company
  founded in 2005 as a research-driven "green computing" venture, now supplying chassis-level
  liquid cooling for AI, HPC, data center and edge infrastructure. Its "direct to everything"
  single-phase immersion approach removes heat from every component rather than the processor
  alone, and ships as two product lines: KUL BOX for near-edge AI and HPC deployments, and
  KUL AI liquid-cooled server chassis for high-density rack environments. The company licenses
  its thermal IP (228 patents granted, allowed and pending) and works through OEM/ODM partnerships
  with vendors including HPE, Intel and nVent. Iceotope is a hardware and thermal-engineering
  business: it publishes no developer program, no public API, and no machine-readable API
  contract on any host it controls.'
